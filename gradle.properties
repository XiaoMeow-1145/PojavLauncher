android.enableJetifier=true
android.useAndroidX=true
android.bundle.enableUncompressedNativeLibs=false
android.bundle.language.enableSplit=false
android.bundle.language.enableSplit=false

# Override JVM options to remove MaxPermSize which is not supported in Java 17
org.gradle.jvmargs=-XX:+HeapDumpOnOutOfMemoryError --add-opens java.base/java.util=ALL-UNNAMED --add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.lang.invoke=ALL-UNNAMED --add-opens java.base/java.util=ALL-UNNAMED --add-opens java.prefs/java.util.prefs=ALL-UNNAMED --add-opens java.prefs/java.util.prefs=ALL-UNNAMED --add-opens java.base/java.nio.charset=ALL-UNNAMED --add-opens java.base/java.net=ALL-UNNAMED --add-opens java.base/java.util.concurrent.atomic=ALL-UNNAMED -Xmx2048m
